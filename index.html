<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiBOS V1 - Aplikasi Pengelolaan Dana BOS & Belanja SI</title>
  <link rel="icon" type="image/png" href="sibos_icon.png">
  <link rel="apple-touch-icon" href="sibos_icon.png">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (cdnjs fast CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX (cdnjs fast CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>
  <!-- SheetJS / XLSX for Excel Export & Import -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- PDF.js for PDF Parsing & Import -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 0;
    }
    .sidebar-fixed {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 260px;
      background-color: #0f172a;
      color: #cbd5e1;
      z-index: 50;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease-in-out;
    }
    .main-content {
      margin-left: 260px;
      min-height: 100vh;
      background-color: #f8fafc;
      transition: margin-left 0.3s ease-in-out;
    }
    .bg-purchased-yellow {
      background-color: #fef08a !important; /* Yellow-200 */
      color: #854d0e !important;
    }
    .row-header-standar { background-color: #fee2e2 !important; font-weight: 700; }
    .row-header-kegiatan { background-color: #dcfce7 !important; font-weight: 700; }
    .row-header-sub { background-color: #fef9c3 !important; font-weight: 600; }
    @media (max-width: 768px) {
      .sidebar-fixed {
        width: 280px;
        transform: translateX(-100%);
      }
      .sidebar-fixed.mobile-open {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0 !important;
        width: 100% !important;
      }
    }
    @media print {
      @page {
        size: A4 landscape;
        margin: 6mm 8mm;
      }
      body {
        background-color: #ffffff !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print { display: none !important; }
      .sidebar-fixed { display: none !important; }
      .main-content { margin-left: 0 !important; padding: 0 !important; width: 100% !important; }
      .print-container { padding: 0 !important; margin: 0 !important; box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
      .overflow-x-auto { overflow: visible !important; }
      table { border-collapse: collapse !important; width: 100% !important; page-break-inside: auto; }
      tr { page-break-inside: avoid; page-break-after: auto; }
      thead { display: table-header-group; }
      tfoot { display: table-footer-group; }
      th, td { border: 1px solid #000 !important; padding: 4px 6px !important; }
    }
  </style>
<body>
  <div id="root"></div>

  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("Global Error Handler caught:", message, "at line", lineno);
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
          <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background-color: #f8fafc; padding: 20px; text-align: center;">
            <div style="background: white; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #fecdd3; max-width: 600px; width: 100%;">
              <div style="font-size: 40px; margin-bottom: 12px;">⚠️</div>
              <h2 style="margin: 0 0 8px 0; color: #9f1239; font-size: 20px; font-weight: 700;">Masalah Muat Cache Browser</h2>
              <div style="background: #fff1f2; border: 1px solid #fecdd3; padding: 12px; border-radius: 8px; text-align: left; font-family: monospace; font-size: 11px; color: #9f1239; margin-bottom: 16px; word-break: break-all;">
                <strong>Pesan:</strong> ${message}<br>
                <strong>File / Line:</strong> ${source}:${lineno}:${colno}<br>
                ${error && error.stack ? `<pre style="white-space: pre-wrap; font-size: 10px; margin-top: 6px;">${error.stack}</pre>` : ''}
              </div>
              <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload(true);" style="width: 100%; padding: 12px 20px; background: #dc2626; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer;">
                🔄 Reset Cache & Buka Aplikasi Baru
              </button>
            </div>
          </div>
        `;
      }
    };
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    const MONTHS = [
      "Januari", "Februari", "Maret", "April", "Mei", "Juni",
      "Juli", "Agustus", "September", "Oktober", "November", "Desember"
    ];

    // Helper Format Ribuan dengan Titik (misal: 7950000 -> 7.950.000)
    const formatRupiah = (val) => {
      if (val === "" || val === null || val === undefined) return "";
      const numStr = String(val).replace(/[^0-9]/g, "");
      if (!numStr) return "";
      return Number(numStr).toLocaleString("id-ID");
    };

    const parseRupiah = (formattedStr) => {
      if (!formattedStr) return 0;
      return Number(String(formattedStr).replace(/[^0-9]/g, ""));
    };

    // Helper Konversi Tanggal "DD/MM/YYYY" <-> "YYYY-MM-DD" untuk <input type="date"> (Calendar Picker)
    const formatDateToIso = (dateStr) => {
      if (!dateStr) return "";
      if (dateStr.includes("-")) return dateStr;
      const parts = dateStr.split("/");
      if (parts.length === 3) {
        const [d, m, y] = parts;
        return `${y}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
      }
      return "";
    };

    const formatIsoToDdMmYyyy = (isoStr) => {
      if (!isoStr) return "";
      if (isoStr.includes("/")) return isoStr;
      const parts = isoStr.split("-");
      if (parts.length === 3) {
        const [y, m, d] = parts;
        return `${d.padStart(2, "0")}/${m.padStart(2, "0")}/${y}`;
      }
      return isoStr;
    };

    // DATABASE MASTER RKAS PDF (165 ITEM LENGKAP DARI PDF ASLI)
    const RKAS_PDF_165_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN JANUARI 2026 (93 BARIS ITEM LENGKAP DARI PDF RESMI - TOTAL RP 72.901.000)
    const JANUARI_PERBULAN_93_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN JULI 2026 (91 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 68.239.000)
    const JULI_PERBULAN_91_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN AGUSTUS 2026 (30 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 20.899.000)
    const AGUSTUS_PERBULAN_30_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN SEPTEMBER 2026 (20 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 10.689.000)
    const SEPTEMBER_PERBULAN_20_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN OKTOBER 2026 (12 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 8.939.000)
    const OKTOBER_PERBULAN_12_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN NOVEMBER 2026 (20 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 10.339.000)
    const NOVEMBER_PERBULAN_20_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN FEBRUARI 2026 (12 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 8.939.000)
    const FEBRUARI_PERBULAN_12_ITEMS = [];

    // RINCIAN KERTAS KERJA PERBULAN DESEMBER 2026 (12 BARIS ITEM LENGKAP DARI PDF ASLI - TOTAL RP 8.939.000)
    const DESEMBER_PERBULAN_12_ITEMS = [];

        // HELPER INDONESIAN TERBILANG
    const angkaToTerbilang = (n) => {
      const nominal = Math.abs(Math.floor(Number(n) || 0));
      if (nominal === 0) return "Nol Rupiah";

      const satuan = ["", "Satu", "Dua", "Tiga", "Empat", "Lima", "Enam", "Tujuh", "Delapan", "Sembilan", "Sepuluh", "Sebelas"];

      function bilang(val) {
        if (val < 12) return satuan[val];
        if (val < 20) return bilang(val - 10) + " Belas";
        if (val < 100) return bilang(Math.floor(val / 10)) + " Puluh " + bilang(val % 10);
        if (val < 200) return "Seratus " + bilang(val - 100);
        if (val < 1000) return bilang(Math.floor(val / 100)) + " Ratus " + bilang(val % 100);
        if (val < 2000) return "Seribu " + bilang(val - 1000);
        if (val < 1000000) return bilang(Math.floor(val / 1000)) + " Ribu " + bilang(val % 1000);
        if (val < 1000000000) return bilang(Math.floor(val / 1000000)) + " Juta " + bilang(val % 1000000);
        if (val < 1000000000000) return bilang(Math.floor(val / 1000000000)) + " Milyar " + bilang(val % 1000000000);
        return bilang(Math.floor(val / 1000000000000)) + " Triliun " + bilang(val % 1000000000000);
      }

      const hasil = bilang(nominal).replace(/\s+/g, ' ').trim();
      return (hasil ? hasil + " Rupiah" : "Nol Rupiah");
    };

        // HELPER PARSE INDONESIAN DATE DD/MM/YYYY TO TIMESTAMP (HOISTED FUNCTION)
    function parseIndoDateToTimestamp(dateStr) {
      if (!dateStr || typeof dateStr !== 'string' || !dateStr.trim()) return 0;
      const parts = dateStr.trim().split('/');
      if (parts.length === 3) {
        const d = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const y = parseInt(parts[2], 10);
        if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
          return new Date(y, m, d).getTime();
        }
      }
      return 0;
    }

    // URL RESMI DATABASE CLOUD FIREBASE REALTIME SIBOS V1
    const SIBOS_FIREBASE_DB_URL = "https://sibos-54bcc-default-rtdb.asia-southeast1.firebasedatabase.app/";
    const SIBOS_OFFICIAL_GAS_URL = SIBOS_FIREBASE_DB_URL;

    const normalizeFirebaseBaseUrl = (url) => {
      const raw = (url || SIBOS_FIREBASE_DB_URL).trim().replace(/\/+$/, "");
      return raw.endsWith(".json") ? raw.replace(/\/[^\/]*\.json$/i, "") : raw;
    };

    const normalizeArrayData = (val) => {
      if (!val) return [];
      if (Array.isArray(val)) return val.filter(x => x !== null && x !== undefined);
      if (typeof val === "object") return Object.values(val).filter(x => x !== null && x !== undefined);
      return [];
    };

    const normalizeObjectMap = (val) => {
      if (!val || typeof val !== "object") return {};
      const out = {};
      Object.keys(val).forEach(k => {
        if (val[k] !== null && val[k] !== undefined) {
          out[k] = val[k];
        }
      });
      return out;
    };

    const normalizePerBulanData = (raw) => {
      const base = {
        "Januari": [], "Februari": [], "Maret": [], "April": [], "Mei": [], "Juni": [],
        "Juli": [], "Agustus": [], "September": [], "Oktober": [], "November": [], "Desember": []
      };
      if (raw && typeof raw === "object") {
        MONTHS.forEach(m => {
          if (raw[m]) {
            base[m] = normalizeArrayData(raw[m]);
          }
        });
      }
      return base;
    };
    
    function AuthPage({ accounts, onLogin, onRegister, onUpdateAccounts, appsScriptUrl, onSaveAppsScriptUrl, onFetchAccountsFromCloud }) {
      const [tab, setTab] = useState("login");
      const [loginNpsn, setLoginNpsn] = useState("");
      const [loginPassword, setLoginPassword] = useState("");
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState("");

      const [regNpsn, setRegNpsn] = useState("");
      const [regNamaSekolah, setRegNamaSekolah] = useState("");
      const [regKepalaSekolah, setRegKepalaSekolah] = useState("");
      const [regError, setRegError] = useState("");

      // Cloud Database Config Modal States
      const [showCloudConfigModal, setShowCloudConfigModal] = useState(false);
      const [inputCloudUrl, setInputCloudUrl] = useState(appsScriptUrl || SIBOS_FIREBASE_DB_URL);
      const [cloudStatus, setCloudStatus] = useState({ type: "", text: "" });
      const [isTestingCloud, setIsTestingCloud] = useState(false);

      const handleTestAndSyncCloud = async () => {
        const url = (inputCloudUrl || SIBOS_FIREBASE_DB_URL).trim();
        if (!url) {
          setCloudStatus({ type: "error", text: "Mohon masukkan URL Firebase Realtime Database Anda." });
          return;
        }
        setIsTestingCloud(true);
        setCloudStatus({ type: "info", text: "Menghubungi Firebase Realtime Database..." });
        try {
          if (onSaveAppsScriptUrl) onSaveAppsScriptUrl(url);
          const cloudRes = onFetchAccountsFromCloud ? await onFetchAccountsFromCloud(url) : null;
          if (cloudRes && cloudRes.success) {
            const count = (cloudRes.accounts && cloudRes.accounts.length) || 0;
            setCloudStatus({ type: "success", text: `✅ Berhasil terhubung ke Firebase! Ditemukan ${count} akun sekolah tersinkron.` });
          } else {
            const baseUrl = normalizeFirebaseBaseUrl(url);
            const res = await fetch(`${baseUrl}/.json?shallow=true`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            setCloudStatus({ type: "success", text: "✅ Berhasil terhubung ke Firebase Realtime Database!" });
          }
        } catch (err) {
          setCloudStatus({ type: "error", text: `❌ Gagal terhubung ke Firebase: ${err.message || err}` });
        } finally {
          setIsTestingCloud(false);
        }
      };

      // Super Admin States
      const [showSuperAdminModal, setShowSuperAdminModal] = useState(false);
      const [isSuperAdminLoggedIn, setIsSuperAdminLoggedIn] = useState(false);
      const [saPassword, setSaPassword] = useState("");
      const [saError, setSaError] = useState("");
      
      // Super Admin Management Modal States
      const [saActionModal, setSaActionModal] = useState(null); // 'add' | 'edit' | null
      const [saSchoolForm, setSaSchoolForm] = useState({ originalNpsn: "", npsn: "", namaSekolah: "", kepalaSekolah: "", password: "" });
      const [showPasswordMap, setShowPasswordMap] = useState({});

      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setLoginError("");
        const cleanNpsn = loginNpsn.trim();
        const cleanPass = loginPassword.trim();

        if (!cleanNpsn || !cleanPass) {
          setLoginError("Mohon isi Username / NPSN dan Password.");
          return;
        }

        // Selalu cek akun terbaru dari Firebase agar sinkron antara Komputer dan HP
        let latestAccounts = accounts;
        if (onFetchAccountsFromCloud) {
          try {
            const cloudRes = await onFetchAccountsFromCloud();
            if (cloudRes && Array.isArray(cloudRes.accounts) && cloudRes.accounts.length > 0) {
              latestAccounts = cloudRes.accounts;
            }
          } catch(err) {}
        }

        let acc = latestAccounts.find(a => a.npsn === cleanNpsn || (a.namaSekolah && a.namaSekolah.toLowerCase() === cleanNpsn.toLowerCase()));

        if (!acc) {
          setLoginError(`NPSN "${cleanNpsn}" belum terdaftar di Firebase. Silakan lakukan registrasi sekolah terlebih dahulu.`);
          return;
        }

        if (String(acc.password) !== cleanPass) {
          setLoginError("Password salah. Mohon periksa kembali Password Anda.");
          return;
        }

        onLogin(acc);
      };

      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setRegError("");
        const cleanNpsn = regNpsn.trim();
        const cleanNama = regNamaSekolah.trim();
        const cleanKepsek = regKepalaSekolah.trim();

        if (!cleanNpsn || !cleanNama || !cleanKepsek) {
          setRegError("Mohon lengkapi Nama Sekolah, NPSN, dan Nama Kepala Sekolah.");
          return;
        }

        let latestAccounts = accounts;
        if (onFetchAccountsFromCloud) {
          try {
            const cloudRes = await onFetchAccountsFromCloud();
            if (cloudRes && Array.isArray(cloudRes.accounts) && cloudRes.accounts.length > 0) {
              latestAccounts = cloudRes.accounts;
            }
          } catch(err) {}
        }

        const existing = latestAccounts.find(a => a.npsn === cleanNpsn);
        if (existing) {
          setRegError(`NPSN ${cleanNpsn} sudah terdaftar (${existing.namaSekolah}). Silakan masuk via menu Login.`);
          return;
        }

        const newAcc = {
          npsn: cleanNpsn,
          namaSekolah: cleanNama,
          kepalaSekolah: cleanKepsek,
          password: cleanNpsn // Password default adalah NPSN!
        };

        onRegister(newAcc);
      };

      const handleSuperAdminAuthSubmit = (e) => {
        e.preventDefault();
        setSaError("");
        if (saPassword.trim() === "hdt123") {
          setIsSuperAdminLoggedIn(true);
          setSaError("");
          if (onFetchAccountsFromCloud) onFetchAccountsFromCloud();
        } else {
          setSaError("Password Super Admin salah!");
        }
      };

      const handleSaveSchoolBySuperAdmin = (e) => {
        e.preventDefault();
        const cleanNpsn = saSchoolForm.npsn.trim();
        const cleanNama = saSchoolForm.namaSekolah.trim();
        const cleanKepsek = saSchoolForm.kepalaSekolah.trim();
        const cleanPass = saSchoolForm.password.trim() || cleanNpsn;

        if (!cleanNpsn || !cleanNama) {
          alert("NPSN dan Nama Sekolah wajib diisi.");
          return;
        }

        if (saActionModal === 'add') {
          if (accounts.some(a => a.npsn === cleanNpsn)) {
            alert(`NPSN ${cleanNpsn} sudah terdaftar! Gunakan NPSN lain.`);
            return;
          }
          const newSchool = {
            npsn: cleanNpsn,
            namaSekolah: cleanNama,
            kepalaSekolah: cleanKepsek || "Kepala Sekolah",
            password: cleanPass
          };
          const next = [...accounts, newSchool];
          onUpdateAccounts(next);
          alert(`✅ Sekolah ${cleanNama} (NPSN: ${cleanNpsn}) berhasil ditambahkan ke Firebase!`);
        } else if (saActionModal === 'edit') {
          const next = accounts.map(a => a.npsn === saSchoolForm.originalNpsn ? {
            ...a,
            npsn: cleanNpsn,
            namaSekolah: cleanNama,
            kepalaSekolah: cleanKepsek,
            password: cleanPass
          } : a);
          onUpdateAccounts(next);
          alert(`✅ Data sekolah ${cleanNama} berhasil diperbarui di Firebase!`);
        }

        setSaActionModal(null);
      };

      const handleDeleteSchoolBySuperAdmin = (school) => {
        if (confirm(`Apakah Anda yakin ingin menghapus sekolah "${school.namaSekolah}" (NPSN: ${school.npsn})?\n\nSemua data anggaran dan belanja sekolah ini akan dihapus dari Firebase.`)) {
          const next = accounts.filter(a => a.npsn !== school.npsn);
          onUpdateAccounts(next, school.npsn);
          alert(`✅ Sekolah "${school.namaSekolah}" berhasil dihapus dari Firebase.`);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 flex items-center justify-center p-4 relative">
          
          {/* TOMBOL GIR SUPER ADMIN DI KANAN ATAS */}
          <div className="fixed top-5 right-5 z-40 flex items-center gap-2">
            <button
              type="button"
              onClick={() => { setShowSuperAdminModal(true); setSaPassword(""); setSaError(""); }}
              title="Panel Super Admin"
              className="w-10 h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-amber-400 border border-slate-700/80 backdrop-blur-md flex items-center justify-center transition shadow-xl hover:scale-110 cursor-pointer text-lg"
            >
              ⚙️
            </button>
          </div>

          <div className="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-slate-700/30 overflow-hidden z-10">
            <div className="bg-slate-900 p-6 text-center text-white relative border-b border-slate-800">
              <div className="w-20 h-20 rounded-2xl overflow-hidden mx-auto mb-3 shadow-xl shadow-blue-500/20 border border-slate-700/60 bg-slate-950 flex items-center justify-center p-1">
                <img src="sibos_icon.png" alt="SiBos Logo" className="w-full h-full object-contain rounded-xl" />
              </div>
              <h1 className="text-2xl font-bold tracking-tight text-white">Aplikasi SiBos</h1>
              <p className="text-xs text-slate-400 mt-1">Pengelolaan BOS & RKAS Multi-Sekolah Terintegrasi</p>
            </div>

            <div className="flex border-b border-slate-200 bg-slate-50">
              <button
                type="button"
                onClick={() => { setTab("login"); setLoginError(""); }}
                className={`flex-1 py-3 text-sm font-semibold transition ${tab === "login" ? "bg-white text-blue-600 border-b-2 border-blue-600" : "text-slate-500 hover:text-slate-700"}`}
              >
                🔑 Masuk (Login)
              </button>
              <button
                type="button"
                onClick={() => { setTab("register"); setRegError(""); }}
                className={`flex-1 py-3 text-sm font-semibold transition ${tab === "register" ? "bg-white text-blue-600 border-b-2 border-blue-600" : "text-slate-500 hover:text-slate-700"}`}
              >
                📝 Registrasi Sekolah
              </button>
            </div>

            <div className="p-6">
              {tab === "login" ? (
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  {loginError && (
                    <div className="p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs font-medium">
                      ⚠️ {loginError}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      User / NPSN Sekolah
                    </label>
                    <input
                      type="text"
                      placeholder="Masukkan NPSN Sekolah..."
                      value={loginNpsn}
                      onChange={(e) => setLoginNpsn(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-medium"
                      required
                      autoFocus
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Password
                    </label>
                    <div className="relative">
                      <input
                        type={showLoginPassword ? "text" : "password"}
                        placeholder="Masukkan Password..."
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                        className="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2.5 pr-10 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-medium"
                        required
                      />
                      <button
                        type="button"
                        onClick={() => setShowLoginPassword(!showLoginPassword)}
                        className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 text-sm cursor-pointer"
                        title="Tampilkan / Sembunyikan Password"
                      >
                        {showLoginPassword ? "🙈" : "👁️"}
                      </button>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition duration-200 mt-2 cursor-pointer"
                  >
                    MASUK KE SIBOS
                  </button>

                  <div className="text-center pt-2">
                    <span className="text-xs text-slate-500">Sekolah belum terdaftar? </span>
                    <button
                      type="button"
                      onClick={() => setTab("register")}
                      className="text-xs font-bold text-blue-600 hover:underline cursor-pointer"
                    >
                      Daftar Sekolah Sekarang
                    </button>
                  </div>
                </form>
              ) : (
                <form onSubmit={handleRegisterSubmit} className="space-y-4">
                  {regError && (
                    <div className="p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl text-xs font-medium">
                      ⚠️ {regError}
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Nama Sekolah
                    </label>
                    <input
                      type="text"
                      placeholder="Masukkan Nama Sekolah..."
                      value={regNamaSekolah}
                      onChange={(e) => setRegNamaSekolah(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      NPSN Sekolah (sebagai User & Password awal)
                    </label>
                    <input
                      type="text"
                      placeholder="Masukkan NPSN Sekolah..."
                      value={regNpsn}
                      onChange={(e) => setRegNpsn(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Nama Kepala Sekolah
                    </label>
                    <input
                      type="text"
                      placeholder="Masukkan Nama Kepala Sekolah..."
                      value={regKepalaSekolah}
                      onChange={(e) => setRegKepalaSekolah(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                      required
                    />
                  </div>

                  <div className="p-3 bg-blue-50 border border-blue-200 rounded-xl text-[11px] text-blue-800">
                    💡 <strong>Info Akun:</strong> Setelah berhasil registrasi, Anda akan langsung masuk ke aplikasi dengan <strong>ruang kerja bersih/kosong</strong>. Password login otomatis tersetting sama dengan NPSN.
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-500/25 transition duration-200 mt-2 cursor-pointer"
                  >
                    DAFTAR & LANGSUNG MASUK SIBOS
                  </button>

                  <div className="text-center pt-2">
                    <span className="text-xs text-slate-500">Sudah punya akun? </span>
                    <button
                      type="button"
                      onClick={() => setTab("login")}
                      className="text-xs font-bold text-blue-600 hover:underline cursor-pointer"
                    >
                      Kembali ke Login
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>

          {/* MODAL SUPER ADMIN AUTH (PASSWORD HDT123) */}
          {showSuperAdminModal && !isSuperAdminLoggedIn && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-700/20 max-w-sm w-full overflow-hidden">
                <div className="bg-slate-900 p-5 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚙️</span>
                    <div>
                      <h3 className="font-bold text-sm text-white">Login Super Admin</h3>
                      <p className="text-[11px] text-slate-400">Akses Manajemen Seluruh Sekolah</p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => setShowSuperAdminModal(false)}
                    className="text-slate-400 hover:text-white text-xl cursor-pointer"
                  >
                    &times;
                  </button>
                </div>
                <form onSubmit={handleSuperAdminAuthSubmit} className="p-5 space-y-4">
                  {saError && (
                    <div className="p-2.5 bg-red-50 border border-red-200 text-red-700 rounded-lg text-xs font-semibold">
                      ⚠️ {saError}
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Password Super Admin:
                    </label>
                    <input
                      type="password"
                      placeholder="Masukkan Password Super Admin..."
                      value={saPassword}
                      onChange={(e) => setSaPassword(e.target.value)}
                      className="w-full text-sm border border-slate-300 rounded-xl px-3 py-2.5 focus:ring-2 focus:ring-amber-500 outline-none"
                      autoFocus
                      required
                    />
                  </div>
                  <div className="flex gap-2 pt-1">
                    <button
                      type="button"
                      onClick={() => setShowSuperAdminModal(false)}
                      className="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl"
                    >
                      Batal
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl shadow-md shadow-amber-600/30"
                    >
                      Masuk Super Admin
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL DASHBOARD SUPER ADMIN */}
          {showSuperAdminModal && isSuperAdminLoggedIn && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 md:p-6 z-50 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-300 max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden my-auto">
                {/* HEADER */}
                <div className="bg-slate-900 px-6 py-4 text-white flex items-center justify-between border-b border-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-xl">
                      ⚙️
                    </div>
                    <div>
                      <h2 className="font-bold text-base text-white flex items-center gap-2">
                        Panel Super Admin SiBOS
                        <span className="text-[10px] bg-amber-500 text-slate-950 font-extrabold px-2 py-0.5 rounded-full">
                          {accounts.length} Sekolah
                        </span>
                      </h2>
                      <p className="text-xs text-slate-400">Daftar Akun Sekolah Terdaftar & Akses Multi-Tenant</p>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => {
                        setSaSchoolForm({ originalNpsn: "", npsn: "", namaSekolah: "", kepalaSekolah: "", password: "" });
                        setSaActionModal('add');
                      }}
                      className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition flex items-center gap-1 shadow cursor-pointer"
                    >
                      ➕ Tambah Sekolah
                    </button>
                    <button
                      type="button"
                      onClick={() => { setShowSuperAdminModal(false); setIsSuperAdminLoggedIn(false); }}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-bold text-xs rounded-lg transition cursor-pointer"
                    >
                      ✕ Tutup
                    </button>
                  </div>
                </div>

                {/* BODY / TABEL DAFTAR SEKOLAH */}
                <div className="p-5 overflow-y-auto flex-1 bg-slate-50">
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <table className="w-full text-left text-xs border-collapse">
                      <thead>
                        <tr className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                          <th className="py-3 px-3 w-10 text-center">No</th>
                          <th className="py-3 px-3">Nama Sekolah</th>
                          <th className="py-3 px-3">NPSN (User)</th>
                          <th className="py-3 px-3">Password</th>
                          <th className="py-3 px-3">Kepala Sekolah</th>
                          <th className="py-3 px-3 text-center w-48">Aksi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {accounts.length === 0 ? (
                          <tr>
                            <td colSpan="6" className="py-8 text-center text-slate-400 font-medium">
                              Belum ada akun sekolah yang terdaftar. Silakan tambah sekolah atau lakukan registrasi.
                            </td>
                          </tr>
                        ) : accounts.map((acc, idx) => {
                          const isShowPass = !!showPasswordMap[acc.npsn];
                          return (
                            <tr key={acc.npsn} className="hover:bg-slate-50/80 transition">
                              <td className="py-3 px-3 text-center font-bold text-slate-500">{idx + 1}</td>
                              <td className="py-3 px-3 font-bold text-slate-900">{acc.namaSekolah}</td>
                              <td className="py-3 px-3 font-mono font-bold text-blue-700 bg-blue-50/50 rounded">{acc.npsn}</td>
                              <td className="py-3 px-3 font-mono">
                                <div className="flex items-center gap-1.5">
                                  <span className="font-semibold text-slate-800">
                                    {isShowPass ? acc.password : "••••••••"}
                                  </span>
                                  <button
                                    type="button"
                                    onClick={() => setShowPasswordMap(prev => ({ ...prev, [acc.npsn]: !prev[acc.npsn] }))}
                                    className="text-xs text-slate-400 hover:text-slate-600 p-0.5 cursor-pointer"
                                    title={isShowPass ? "Sembunyikan password" : "Lihat password"}
                                  >
                                    {isShowPass ? "🙈" : "👁️"}
                                  </button>
                                </div>
                              </td>
                              <td className="py-3 px-3 text-slate-700 font-medium">{acc.kepalaSekolah || "-"}</td>
                              <td className="py-3 px-3 text-center">
                                <div className="flex items-center justify-center gap-1.5">
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setShowSuperAdminModal(false);
                                      setIsSuperAdminLoggedIn(false);
                                      onLogin(acc);
                                    }}
                                    className="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[11px] rounded-lg transition shadow-sm cursor-pointer"
                                    title="Masuk langsung ke ruang kerja sekolah ini"
                                  >
                                    🔑 Masuk
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => {
                                      setSaSchoolForm({
                                        originalNpsn: acc.npsn,
                                        npsn: acc.npsn,
                                        namaSekolah: acc.namaSekolah,
                                        kepalaSekolah: acc.kepalaSekolah || "",
                                        password: acc.password
                                      });
                                      setSaActionModal('edit');
                                    }}
                                    className="px-2 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-300 font-bold text-[11px] rounded-lg transition cursor-pointer"
                                    title="Edit Sekolah"
                                  >
                                    ✏️ Edit
                                  </button>
                                  <button
                                    type="button"
                                    onClick={() => handleDeleteSchoolBySuperAdmin(acc)}
                                    className="px-2 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 font-bold text-[11px] rounded-lg transition cursor-pointer"
                                    title="Hapus Sekolah"
                                  >
                                    🗑️ Hapus
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* MODAL TAMBAH / EDIT SEKOLAH OLEH SUPER ADMIN */}
                {saActionModal && (
                  <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4 z-60">
                    <div className="bg-white rounded-xl shadow-2xl border border-slate-300 max-w-md w-full overflow-hidden">
                      <div className="bg-slate-900 px-5 py-3.5 text-white flex justify-between items-center">
                        <h4 className="font-bold text-sm">
                          {saActionModal === 'add' ? '➕ Tambah Sekolah Baru' : '✏️ Edit Data Sekolah'}
                        </h4>
                        <button
                          type="button"
                          onClick={() => setSaActionModal(null)}
                          className="text-slate-400 hover:text-white font-bold"
                        >
                          &times;
                        </button>
                      </div>
                      <form onSubmit={handleSaveSchoolBySuperAdmin} className="p-5 space-y-3.5">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Nama Sekolah:</label>
                          <input
                            type="text"
                            required
                            value={saSchoolForm.namaSekolah}
                            onChange={(e) => setSaSchoolForm({ ...saSchoolForm, namaSekolah: e.target.value })}
                            className="w-full text-xs font-semibold border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Masukkan Nama Sekolah..."
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">NPSN (Username Login):</label>
                          <input
                            type="text"
                            required
                            value={saSchoolForm.npsn}
                            onChange={(e) => setSaSchoolForm({ ...saSchoolForm, npsn: e.target.value })}
                            className="w-full text-xs font-mono font-bold border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Masukkan NPSN..."
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Nama Kepala Sekolah:</label>
                          <input
                            type="text"
                            value={saSchoolForm.kepalaSekolah}
                            onChange={(e) => setSaSchoolForm({ ...saSchoolForm, kepalaSekolah: e.target.value })}
                            className="w-full text-xs font-semibold border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Masukkan Nama Kepala Sekolah..."
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Password Login:</label>
                          <input
                            type="text"
                            required
                            value={saSchoolForm.password}
                            onChange={(e) => setSaSchoolForm({ ...saSchoolForm, password: e.target.value })}
                            className="w-full text-xs font-mono font-bold border border-slate-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Ketik password login sekolah..."
                          />
                          <p className="text-[11px] text-slate-400 mt-1">Default password adalah NPSN.</p>
                        </div>

                        <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                          <button
                            type="button"
                            onClick={() => setSaActionModal(null)}
                            className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-lg"
                          >
                            Batal
                          </button>
                          <button
                            type="submit"
                            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow-sm"
                          >
                            Simpan Data
                          </button>
                        </div>
                      </form>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    function App() {
      const [appsScriptUrl, setAppsScriptUrl] = useState(SIBOS_FIREBASE_DB_URL);

      const handleSaveAppsScriptUrl = (newUrl) => {
        const cleaned = (newUrl || SIBOS_FIREBASE_DB_URL).trim();
        setAppsScriptUrl(cleaned);
      };

      const [accounts, setAccounts] = useState([]);

      const saveAccountsToFirebase = useCallback(async (accsToSave, urlToUse) => {
        const baseUrl = normalizeFirebaseBaseUrl(urlToUse || appsScriptUrl);
        try {
          if (!accsToSave || accsToSave.length === 0) {
            await fetch(`${baseUrl}/accounts.json`, { method: "DELETE" });
          } else {
            await fetch(`${baseUrl}/accounts.json`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(accsToSave)
            });
          }
          return true;
        } catch (err) {
          console.warn("Firebase save accounts error:", err);
          return false;
        }
      }, [appsScriptUrl]);

      // Fungsi ambil data akun langsung dari Firebase Realtime Database (mulai dari 0 jika belum ada akun)
      const fetchAccountsFromCloud = useCallback(async (urlToUse) => {
        const baseUrl = normalizeFirebaseBaseUrl(urlToUse || appsScriptUrl);
        try {
          const res = await fetch(`${baseUrl}/accounts.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const rawAccounts = await res.json();
          let list = normalizeArrayData(rawAccounts).filter(a => a && a.npsn);
          setAccounts(list);
          return { success: true, count: list.length, accounts: list };
        } catch (err) {
          return { success: false, message: err.message || "Gagal menghubungi Firebase Realtime Database" };
        }
      }, [appsScriptUrl]);

      // Auto-fetch accounts dari Firebase saat startup, saat fokus jendela, dan berkala agar sinkron di semua perangkat
      useEffect(() => {
        fetchAccountsFromCloud(appsScriptUrl);
        const intervalId = setInterval(() => {
          fetchAccountsFromCloud(appsScriptUrl);
        }, 6000);
        const onFocus = () => fetchAccountsFromCloud(appsScriptUrl);
        window.addEventListener("focus", onFocus);
        return () => {
          clearInterval(intervalId);
          window.removeEventListener("focus", onFocus);
        };
      }, [appsScriptUrl, fetchAccountsFromCloud]);

      // WAJIB KE AKSES LOGIN SETIAP MEMBUKA WEB SIBOS
      // Menggunakan sessionStorage hanya untuk penanda sesi tab aktif saat ini
      const [activeNpsn, setActiveNpsn] = useState(() => {
        return sessionStorage.getItem("bos_active_npsn") || "";
      });

      const currentUser = accounts.find(a => a.npsn === activeNpsn) || null;

      const handleLogin = (acc) => {
        setActiveNpsn(acc.npsn);
        sessionStorage.setItem("bos_active_npsn", acc.npsn);
      };

      const handleRegister = async (newAcc) => {
        const nextAccs = [...accounts.filter(a => a.npsn !== newAcc.npsn), newAcc];
        setAccounts(nextAccs);
        await saveAccountsToFirebase(nextAccs, appsScriptUrl);

        // Siapkan ruang data sekolah baru di Firebase dalam keadaan 100% KOSONG
        const emptyPerbulan = normalizePerBulanData({});
        const initialSchoolData = {
          updatedAt: new Date().toISOString(),
          headerInfo: {
            npsn: newAcc.npsn,
            namaSekolah: newAcc.namaSekolah,
            kepalaSekolah: newAcc.kepalaSekolah || "",
            alamat: "",
            kabupaten: "Kota Bekasi",
            provinsi: "Jawa Barat",
            tahunAnggaran: "2026",
            sumberDana: "BOS Reguler",
            totalPenerimaan: 0,
            bendaharaSekolah: "",
            noRekening: "",
            namaBank: "",
            email: "",
            noHp: ""
          },
          masterRkas: [],
          perBulanData: emptyPerbulan,
          belanjaBankList: [],
          danaMasukList: [],
          saldoAwal: 0,
          manualPurchasedMap: {},
          manualKeteranganTextMap: {},
          customLogoUrl: "",
          customKopSuratUrl: ""
        };

        const baseUrl = normalizeFirebaseBaseUrl(appsScriptUrl);
        try {
          await fetch(`${baseUrl}/schools/${encodeURIComponent(newAcc.npsn)}/data.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(initialSchoolData)
          });
        } catch (e) {
          console.warn("Firebase register school data error:", e);
        }

        setActiveNpsn(newAcc.npsn);
        sessionStorage.setItem("bos_active_npsn", newAcc.npsn);
        alert(`✅ Registrasi Berhasil!\n\nSekolah "${newAcc.namaSekolah}" (NPSN: ${newAcc.npsn}) berhasil didaftarkan ke Firebase Realtime Database.\nKepala Sekolah: ${newAcc.kepalaSekolah || '-'}.\n\nAnda langsung dialihkan ke Ruang Kerja SiBos.`);
      };

      const handleLogout = () => {
        if (confirm(`Keluar dari akun ${currentUser ? currentUser.namaSekolah : "Sekolah"}?`)) {
          setActiveNpsn("");
          sessionStorage.removeItem("bos_active_npsn");
        }
      };

      const handleUpdateAccountPassword = async (npsn, newPassword) => {
        const next = accounts.map(a => a.npsn === npsn ? { ...a, password: newPassword } : a);
        setAccounts(next);
        await saveAccountsToFirebase(next, appsScriptUrl);
        alert(`✅ Password akun sekolah berhasil diubah dan tersimpan di Firebase! Gunakan password baru ini saat masuk kembali di komputer maupun HP.`);
      };

      const handleUpdateAccounts = async (newAccounts, deletedNpsn = null) => {
        setAccounts(newAccounts);
        await saveAccountsToFirebase(newAccounts, appsScriptUrl);

        if (deletedNpsn) {
          const baseUrl = normalizeFirebaseBaseUrl(appsScriptUrl);
          try {
            await fetch(`${baseUrl}/schools/${encodeURIComponent(deletedNpsn)}.json`, {
              method: "DELETE"
            });
          } catch (e) {
            console.warn("Firebase delete school error:", e);
          }
        }
      };

      if (!currentUser) {
        return (
          <AuthPage 
            accounts={accounts} 
            onLogin={handleLogin} 
            onRegister={handleRegister}
            onUpdateAccounts={handleUpdateAccounts}
            appsScriptUrl={appsScriptUrl}
            onSaveAppsScriptUrl={handleSaveAppsScriptUrl}
            onFetchAccountsFromCloud={fetchAccountsFromCloud}
          />
        );
      }

      return (
        <SiBosMainApp 
          key={currentUser.npsn} 
          currentUser={currentUser} 
          onLogout={handleLogout}
          onUpdatePassword={handleUpdateAccountPassword}
          appsScriptUrl={appsScriptUrl}
          onSaveAppsScriptUrl={handleSaveAppsScriptUrl}
          onUpdateAccountInfo={async (updatedHeader) => {
            const nextAccs = accounts.map(a => a.npsn === currentUser.npsn ? {
              ...a,
              namaSekolah: updatedHeader.namaSekolah || a.namaSekolah,
              kepalaSekolah: updatedHeader.kepalaSekolah || a.kepalaSekolah
            } : a);
            setAccounts(nextAccs);
            await saveAccountsToFirebase(nextAccs, appsScriptUrl);
          }}
        />
      );
    }


function SiBosMainApp({ currentUser, onLogout, onUpdateAccountInfo, onUpdatePassword, appsScriptUrl, onSaveAppsScriptUrl }) {
      // Menu View: 'database' | 'belanja' | 'si' | 'rekap' | 'perbulan'

      // State Surat Transfer (Surat Pemindahbukuan)

      // Filter Tanggal Cetak Standing Instruction (SI)

      // Header Informasi Sekolah State (murni dari Firebase)

      // Logo Web & Kop Surat State (Base64 / URL dari Firebase)

      // DATABASE MASTER RKAS (murni dari Firebase)

      // DATABASE BELANJA / TRANSAKSI BANK (72 ITEM RESMI DARI DOKUMEN PDF LENGKAP)

      // REKENING KORAN - SALDO AWAL & MANUAL DANA MASUK (KREDIT)

      const [saldoAwal, setSaldoAwal] = useState(0);

      // DATABASE BELANJA / TRANSAKSI BANK (murni dari Firebase)

      // State Manual Checkbox & Keterangan untuk Database Master RKAS (murni dari Firebase)
      const [manualPurchasedMap, setManualPurchasedMap] = useState({});
      const [manualKeteranganTextMap, setManualKeteranganTextMap] = useState({});

      // Handlers Cloud Firebase Realtime Database
      const handlePushDataToCloud = async (silent = false, overrideState = null) => {
        const baseUrl = normalizeFirebaseBaseUrl(appsScriptUrl || cloudUrlInput || SIBOS_FIREBASE_DB_URL);
        setCloudSyncStatus("syncing");
        setCloudStatusMsg("Menyinkronkan ke Firebase...");
        isPushingRef.current = true;
        try {
          const nowIso = new Date().toISOString();
          const stateToPush = overrideState || {
            headerInfo,
            masterRkas,
            perBulanData,
            belanjaBankList,
            danaMasukList,
            saldoAwal,
            manualPurchasedMap,
            manualKeteranganTextMap,
            customLogoUrl,
            customKopSuratUrl
          };
          const payload = {
            updatedAt: nowIso,
            headerInfo: stateToPush.headerInfo || headerInfo,
            masterRkas: stateToPush.masterRkas || [],
            perBulanData: stateToPush.perBulanData || normalizePerBulanData({}),

            danaMasukList: stateToPush.danaMasukList || [],

          const res = await fetch(`${baseUrl}/schools/${encodeURIComponent(currentUser.npsn)}/data.json`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          lastSyncedUpdatedAtRef.current = nowIso;
          const nowStr = new Date().toLocaleString("id-ID");
          setCloudSyncStatus("synced");
          setCloudLastSynced(nowStr);
          setCloudStatusMsg(`Tersinkron Firebase: ${nowStr}`);
          if (!silent) {
            alert(`✅ Sinkronisasi Firebase Berhasil!\n\nSeluruh data sekolah "${payload.headerInfo.namaSekolah || currentUser.namaSekolah}" (NPSN: ${currentUser.npsn}) telah tersimpan di Firebase Realtime Database.\n\nData ini otomatis tersinkron di komputer, laptop, maupun HP!`);

        } catch (err) {
          console.error("Firebase push error:", err);
          setCloudSyncStatus("error");
          setCloudStatusMsg("Gagal sinkron Firebase");
          if (!silent) {
            alert(`⚠️ Gagal menyinkronkan data ke Firebase Realtime Database:\n\n${err.message || err}`);
          }
        } finally {
          isPushingRef.current = false;
        }
      };

      const handlePullDataFromCloud = useCallback(async (silent = false) => {
        const baseUrl = normalizeFirebaseBaseUrl(appsScriptUrl || cloudUrlInput || SIBOS_FIREBASE_DB_URL);
        setCloudSyncStatus("syncing");
        setCloudStatusMsg("Mengambil data dari Firebase...");
        try {
          const res = await fetch(`${baseUrl}/schools/${encodeURIComponent(currentUser.npsn)}/data.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const d = await res.json();

          isApplyingRemoteRef.current = true;

          if (d && typeof d === "object") {
            setHeaderInfo({
              npsn: currentUser.npsn,
              namaSekolah: currentUser.namaSekolah,
              alamat: "",
              kabupaten: "",
              provinsi: "",
              tahunAnggaran: "2026",
              sumberDana: "BOS Reguler",
              totalPenerimaan: 0,
              kepalaSekolah: currentUser.kepalaSekolah || "",
              bendaharaSekolah: "",
              noRekening: "",
              namaBank: "",
              email: "",
              noHp: "",
              ...(d.headerInfo && typeof d.headerInfo === "object" ? d.headerInfo : {})
            });
            setMasterRkas(normalizeArrayData(d.masterRkas));
            setPerBulanData(normalizePerBulanData(d.perBulanData));
            setBelanjaBankList(normalizeArrayData(d.belanjaBankList));
            setDanaMasukList(normalizeArrayData(d.danaMasukList));
            setSaldoAwal(typeof d.saldoAwal === "number" ? d.saldoAwal : Number(d.saldoAwal || 0));
            setManualPurchasedMap(normalizeObjectMap(d.manualPurchasedMap));
            setManualKeteranganTextMap(normalizeObjectMap(d.manualKeteranganTextMap));
            setCustomLogoUrl(d.customLogoUrl || "");
            setCustomKopSuratUrl(d.customKopSuratUrl || "");
            lastSyncedUpdatedAtRef.current = d.updatedAt || "";

            const nowStr = new Date().toLocaleString("id-ID");
            setCloudSyncStatus("synced");
            setCloudLastSynced(nowStr);
            setCloudStatusMsg(`Tersinkron Firebase: ${nowStr}`);

            if (!silent) {
              alert(`✅ Sinkronisasi dari Firebase Berhasil!\n\nSeluruh data terbaru untuk ${d.headerInfo?.namaSekolah || currentUser.namaSekolah} (NPSN: ${currentUser.npsn}) telah dimuat dari Firebase Realtime Database.`);
            }
          } else {
            // Jika sekolah baru dan belum ada node data di Firebase, inisialisasi di Firebase
            const nowStr = new Date().toLocaleString("id-ID");
            setCloudSyncStatus("synced");
            setCloudLastSynced(nowStr);
            setCloudStatusMsg(`Siap di Firebase: ${nowStr}`);
            if (!silent) {
              alert(`ℹ️ Ruang kerja sekolah untuk NPSN ${currentUser.npsn} siap dan terhubung ke Firebase Realtime Database.`);
            }
          }
        } catch (err) {
          console.error("Firebase pull error:", err);
          setCloudSyncStatus("error");
          setCloudStatusMsg("Gagal ambil data Firebase");
          if (!silent) {
            alert(`⚠️ Gagal mengambil data dari Firebase Realtime Database:\n\n${err.message || err}`);
          }
        } finally {
          isCloudReadyRef.current = true;
          setTimeout(() => {
            isApplyingRemoteRef.current = false;
          }, 150);
        }
      }, [appsScriptUrl, cloudUrlInput, currentUser.npsn, currentUser.namaSekolah, currentUser.kepalaSekolah]);

      const handleTestCloudConnection = async () => {
        const rawUrl = (cloudUrlInput || appsScriptUrl || SIBOS_FIREBASE_DB_URL).trim();
        const baseUrl = normalizeFirebaseBaseUrl(rawUrl);
        setCloudSyncStatus("syncing");
        setCloudStatusMsg("Menguji koneksi Firebase...");
        try {
          const res = await fetch(`${baseUrl}/schools/${encodeURIComponent(currentUser.npsn)}/data/headerInfo.json`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const info = await res.json();
          setCloudSyncStatus("synced");
          setCloudStatusMsg("Koneksi Firebase Aktif!");
          if (onSaveAppsScriptUrl) onSaveAppsScriptUrl(rawUrl);
          alert(`✅ Koneksi Firebase Realtime Database Berhasil!\n\nURL: ${baseUrl}\nSekolah: ${(info && info.namaSekolah) || currentUser.namaSekolah} (NPSN: ${currentUser.npsn})`);
        } catch (err) {
          setCloudSyncStatus("error");
          setCloudStatusMsg("Gagal koneksi Firebase");
          alert(`❌ Gagal terhubung ke Firebase Realtime Database:\n\n${err.message || err}`);
        }
      };

      // 1. Muat data awal langsung dari Firebase saat membuka ruang kerja sekolah
      useEffect(() => {
        isCloudReadyRef.current = false;
        handlePullDataFromCloud(true);
      }, [currentUser.npsn]);

      // 2. Auto-Save ke Firebase setiap kali ada perubahan data apa pun di aplikasi
      useEffect(() => {
        if (!isCloudReadyRef.current) return;
        if (isApplyingRemoteRef.current) return;

        if (autoSaveTimerRef.current) {
          clearTimeout(autoSaveTimerRef.current);
        }
        autoSaveTimerRef.current = setTimeout(() => {
          handlePushDataToCloud(true, {
            headerInfo,
            masterRkas,
            perBulanData,
            belanjaBankList,
            danaMasukList,
            saldoAwal,
            manualPurchasedMap,
            manualKeteranganTextMap,
            customLogoUrl,
            customKopSuratUrl
          });
        }, 400);

        return () => {
          if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
        };
      }, [
        headerInfo,
        masterRkas,
        perBulanData,
        belanjaBankList,
        danaMasukList,
        saldoAwal,
        manualPurchasedMap,
        manualKeteranganTextMap,
        customLogoUrl,
        customKopSuratUrl
      ]);

      // 3. Auto-Pull Realtime dari Firebase jika ada perubahan dari perangkat lain (HP / Komputer lain)
      useEffect(() => {
        const baseUrl = normalizeFirebaseBaseUrl(appsScriptUrl || cloudUrlInput || SIBOS_FIREBASE_DB_URL);
        const checkRemoteUpdate = async () => {
          if (!isCloudReadyRef.current || isPushingRef.current || autoSaveTimerRef.current) return;
          try {
            const res = await fetch(`${baseUrl}/schools/${encodeURIComponent(currentUser.npsn)}/data/updatedAt.json`);
            if (!res.ok) return;
            const remoteUpdatedAt = await res.json();
            if (remoteUpdatedAt && remoteUpdatedAt !== lastSyncedUpdatedAtRef.current) {
              await handlePullDataFromCloud(true);
            }
          } catch (e) {}
        };

        const intervalId = setInterval(checkRemoteUpdate, 4000);
        const onFocus = () => checkRemoteUpdate();
        window.addEventListener("focus", onFocus);
        return () => {
          clearInterval(intervalId);
          window.removeEventListener("focus", onFocus);
        };
      }, [appsScriptUrl, cloudUrlInput, currentUser.npsn, handlePullDataFromCloud]);

      // Handlers Pengaturan & Media
      const handleSavePengaturan = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (onUpdateAccountInfo) {
          await onUpdateAccountInfo(headerInfo);
        }

        const cleanedUrl = (cloudUrlInput || SIBOS_FIREBASE_DB_URL).trim();
        if (cleanedUrl && onSaveAppsScriptUrl) {

        });

        alert("✅ Pengaturan Sekolah, Logo Web, & Kop Surat berhasil disimpan ke Firebase Realtime Database!");

      const handleUploadLogoFile = (e) => {

      const handleUploadKopSuratFile = (e) => {

      const handleResetPengaturanDefault = () => {

          };
          setHeaderInfo(defaultHeader);

      };

      const handleKeteranganTextChange = (no, text) => {

      };

      const toggleManualPurchased = (m, checked) => {
        setManualPurchasedMap(prev => {
          const next = { ...prev };
          next[m.no] = checked;

          if (m.level === "sub") {
            masterRkas.forEach(x => {
              if (x.kodeKegiatan === m.kodeKegiatan && x.no !== m.no) {
                next[x.no] = checked;
              }
            });
          } else if (m.level === "item") {
            const siblingItems = masterRkas.filter(x => x.kodeKegiatan === m.kodeKegiatan && x.level === "item");
            const parentSub = masterRkas.find(x => x.kodeKegiatan === m.kodeKegiatan && x.level === "sub");
            if (parentSub && siblingItems.length > 0) {
              const allChecked = siblingItems.every(s => s.no === m.no ? checked : !!next[s.no]);
              next[parentSub.no] = allChecked;
            }
          }

          return next;
        });
      };

      const [hasBackedUpMaster, setHasBackedUpMaster] = useState(false);
      const [showExportDropdown, setShowExportDropdown] = useState(false);
      const [showMasterExportDropdown, setShowMasterExportDropdown] = useState(false);
      const [selectedRekKoranRekening, setSelectedRekKoranRekening] = useState("Semua");
      const [rekKoranViewMode, setRekKoranViewMode] = useState("detail");

      const handleSaveMasterCheckboxes = async () => {
        await handlePushDataToCloud(true);
        alert("✅ Perubahan centang Aksi & Keterangan manual Master RKAS berhasil disimpan ke Firebase!");
      };

      // 1. Download Backup Data Master RKAS (Wajib)
      const handleBackupMasterData = () => {
        const backupPayload = {
          appTitle: `SiBOS V1 - Backup Database Master RKAS - ${headerInfo.namaSekolah || "Sekolah"}`,
          backupDate: new Date().toISOString(),

        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Backup_Master_RKAS_${(headerInfo.namaSekolah || currentUser.namaSekolah || "Sekolah").replace(/\s+/g, "_")}_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();

        setHasBackedUpMaster(true);
        alert("✅ Backup Data Master RKAS berhasil di-download! Simpan file ini di tempat yang aman.");
      };

      // 2. Impor File PDF / Excel / JSON ARKAS
      const handleImportMasterClick = () => {
        const fileInput = document.getElementById("master-file-import-input");
        if (fileInput) fileInput.click();
      };

      const handleImportMasterFile = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const fileName = file.name.toLowerCase();

        const applyMasterItems = (items, fileLabel) => {
          const finalItems = items || [];
          setMasterRkas(finalItems);
          alert(`✅ IMPOR MASTER RKAS BERHASIL!\n\nFile "${fileLabel}" telah berhasil diproses dan menyajikan ${finalItems.length} item data ke Database Master RKAS (tersinkron ke Firebase).`);
        };

        // 1. File PDF (.pdf)
        if (fileName.endsWith('.pdf')) {
          const reader = new FileReader();
          reader.onload = async (evt) => {
            try {
              let textLinesAll = [];
              if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                const typedarray = new Uint8Array(evt.target.result);
                const pdf = await window.pdfjsLib.getDocument({ data: typedarray }).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const textObj = await page.getTextContent();
                  const lineClusters = [];
                  const sortedItems = textObj.items
                    .filter(it => it.str && it.str.trim())
                    .sort((a, b) => (b.transform ? b.transform[5] : 0) - (a.transform ? a.transform[5] : 0));

                  sortedItems.forEach(it => {
                    const y = it.transform ? it.transform[5] : 0;
                    let cluster = lineClusters.find(c => Math.abs(c.y - y) <= 5.0);
                    if (!cluster) {
                      cluster = { y: y, items: [] };
                      lineClusters.push(cluster);
                    }
                    cluster.items.push(it);
                  });

                  lineClusters.forEach(cluster => {
                    cluster.items.sort((a, b) => (a.transform ? a.transform[4] : 0) - (b.transform ? b.transform[4] : 0));
                    const lineStr = cluster.items.map(it => it.str.trim()).filter(Boolean).join(" ");
                    if (lineStr) textLinesAll.push(lineStr);
                  });
                }
              }

              const isAmountToken = (t) => /^(0|[1-9]\d{0,2}(\.\d{3})+)$/.test(t);

              const parsedItems = [];
              textLinesAll.forEach(line => {
                const mNo = line.match(/^(\d+)\.?\s+(.*)$/);
                if (!mNo) return;
                const noVal = parseInt(mNo[1], 10);
                let rest = mNo[2].trim();

                let kodeRek = "";
                const mRek = rest.match(/^(5\.\d[\d\.]+)\s+(.*)$/);
                if (mRek) {
                  kodeRek = mRek[1];
                  rest = mRek[2].trim();
                }

                let kodeKeg = "";
                const mKeg = rest.match(/^((?:\d{2}\.\s*)+)\s+(.*)$/);
                if (mKeg) {
                  kodeKeg = mKeg[1].replace(/\s+/g, "");
                  rest = mKeg[2].trim();
                }

                const tokens = rest.split(/\s+/);
                const numIndices = [];
                tokens.forEach((t, idx) => {
                  if (isAmountToken(t)) numIndices.push(idx);
                });

                if (numIndices.length === 0) return;

                const firstNumIdx = numIndices[0];
                const uraianStr = tokens.slice(0, firstNumIdx).join(" ").trim();
                if (!uraianStr) return;

                const amounts = tokens.slice(firstNumIdx).filter(t => isAmountToken(t));

                const parseNumStr = (s) => s ? Number(s.replace(/[^0-9]/g, "")) : 0;
                const jumlahVal = amounts.length > 0 ? parseNumStr(amounts[0]) : 0;
                const opVal = amounts.length > 1 ? parseNumStr(amounts[1]) : (kodeRek ? jumlahVal : 0);
                const modalVal = amounts.length > 2 ? parseNumStr(amounts[2]) : 0;

                let level = "item";
                if (!kodeRek) {
                  const dots = (kodeKeg.match(/\d{2}/g) || []).length;
                  if (dots === 1) level = "standar";
                  else if (dots === 2) level = "kegiatan";
                  else if (dots >= 3) level = "sub";
                  else if (uraianStr.toLowerCase().startsWith("standar")) level = "standar";
                }

                parsedItems.push({
                  no: noVal || (parsedItems.length + 1),
                  kodeRekening: kodeRek,

          reader.onload = async (evt) => {
            try {
              let textLinesAll = [];
              if (window.pdfjsLib) {
                window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
                const typedarray = new Uint8Array(evt.target.result);
                const pdf = await window.pdfjsLib.getDocument({ data: typedarray }).promise;
                for (let i = 1; i <= pdf.numPages; i++) {
                  const page = await pdf.getPage(i);
                  const textObj = await page.getTextContent();
                  
                  // Group text items into lines using a 5.0px tolerance threshold
                  const lineClusters = [];
                  const sortedItems = textObj.items
                    .filter(it => it.str && it.str.trim())
                    .sort((a, b) => (b.transform ? b.transform[5] : 0) - (a.transform ? a.transform[5] : 0));

                  sortedItems.forEach(it => {
                    const y = it.transform ? it.transform[5] : 0;
                    let cluster = lineClusters.find(c => Math.abs(c.y - y) <= 5.0);
                    if (!cluster) {
                      cluster = { y: y, items: [] };
                      lineClusters.push(cluster);
                    }
                    cluster.items.push(it);
                  });

                  lineClusters.forEach(cluster => {
                    cluster.items.sort((a, b) => (a.transform ? a.transform[4] : 0) - (b.transform ? b.transform[4] : 0));
                    const lineStr = cluster.items.map(it => it.str.trim()).filter(Boolean).join(" ");
                    if (lineStr) textLinesAll.push(lineStr);
                  });
                }
              }

              // Deteksi otomatis Nama Bulan dari Header PDF jika tersedia (contoh: "Bulan : Oktober 2026")
